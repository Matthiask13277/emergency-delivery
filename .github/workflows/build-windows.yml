name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: emergency-delivery-current-2.2.2-installer
          path: dist/ED-CURRENT-DESKTOP-2.2.2.exe
          if-no-files-found: error
      - name: Upload portable fallback
        uses: actions/upload-artifact@v4
        with:
          name: emergency-delivery-current-2.2.2-portable
          path: dist/ED-CURRENT-DESKTOP-2.2.2.exe
          if-no-files-found: error
