name: GPS change syntax check

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/gps-syntax.yml'
  push:
    branches: ['feature/automatic-driver-gps']
    paths:
      - 'index.html'
      - '.github/workflows/gps-syntax.yml'

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract inline scripts and check JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.current = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.current = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and "".join(self.current).strip():
                          self.scripts.append("".join(self.current))
                      self.in_script = False
                      self.external = False
          parser = ScriptExtractor()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks found")
          for i, script in enumerate(parser.scripts, 1):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} inline JavaScript block(s)")
          PY
          for file in /tmp/inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
