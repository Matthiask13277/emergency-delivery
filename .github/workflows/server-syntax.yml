name: Server JavaScript syntax check

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - '.github/workflows/server-syntax.yml'

jobs:
  server-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server.js syntax
        run: node --check server.js
