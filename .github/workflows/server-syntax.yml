name: Server syntax and schema integration checks

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'gmail-pagination.js'
      - 'tests/gmail-pagination.test.js'
      - 'tests/offline-sync.test.js'
      - 'sync.js'
      - 'package.json'
      - 'index.html'
      - 'local-db.js'
      - 'db/runtime-delay-repair.sql'
      - '.github/workflows/server-syntax.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'gmail-pagination.js'
      - 'tests/gmail-pagination.test.js'
      - 'tests/offline-sync.test.js'
      - 'sync.js'
      - 'package.json'
      - 'index.html'
      - 'local-db.js'
      - 'db/runtime-delay-repair.sql'
      - '.github/workflows/server-syntax.yml'

jobs:
  server-syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emergency_delivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d emergency_delivery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check local-db.js
          node --check gmail-pagination.js
          node --check sync.js
      - name: Run Node test suite
        run: npm test
      - name: Check inline browser JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) {
              console.error('Inline script ' + index + ': ' + error.message);
              process.exitCode = 1;
            }
          });
          if (!process.exitCode) console.log('Checked ' + scripts.length + ' inline scripts.');
          NODE
      - name: Create minimal existing application schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d emergency_delivery_test -v ON_ERROR_STOP=1 -c "
            CREATE TABLE trips (id uuid PRIMARY KEY, trip_number text, status text);
            CREATE TABLE customers (id uuid PRIMARY KEY, company text, email text);
            CREATE TABLE trip_stops (id uuid PRIMARY KEY, trip_id uuid REFERENCES trips(id));
            CREATE TABLE orders (id uuid PRIMARY KEY);
            CREATE TABLE vehicle_documents (id uuid PRIMARY KEY, vehicle_id uuid, valid_until date, status text);
            CREATE TABLE vehicles (id uuid PRIMARY KEY, name text, plate text);
          "
      - name: Apply repair SQL twice to verify idempotency
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d emergency_delivery_test -v ON_ERROR_STOP=1 -f db/runtime-delay-repair.sql
          psql -h localhost -U test -d emergency_delivery_test -v ON_ERROR_STOP=1 -f db/runtime-delay-repair.sql
      - name: Assert required schema objects and rules
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d emergency_delivery_test -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF to_regclass('control_alerts') IS NULL OR to_regclass('delay_escalation_rules') IS NULL
                OR to_regclass('customer_communication_outbox') IS NULL
                OR to_regclass('communication_templates') IS NULL
                OR to_regclass('order_event_links') IS NULL OR to_regclass('trip_event_links') IS NULL
                OR to_regclass('stop_event_links') IS NULL OR to_regclass('notification_event_links') IS NULL THEN
                RAISE EXCEPTION 'required repair tables missing';
              END IF;
              IF (SELECT count(*) FROM delay_escalation_rules WHERE threshold_minutes IN (10,30,60)) <> 3 THEN
                RAISE EXCEPTION 'delay escalation defaults missing or duplicated';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='trip_stops' AND column_name='customer_delay_notified_at')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='customer_communication_outbox' AND column_name='next_attempt_at')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='vehicle_documents' AND column_name='title')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='trip_stops' AND column_name='time_window_start')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='trip_stops' AND column_name='delivery_photo')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='vehicle_documents' AND column_name='valid_from')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='vehicle_documents' AND column_name='valid_until')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='trip_stops' AND column_name='proof_lat')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='trip_stops' AND column_name='proof_lng')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='trip_stops' AND column_name='proof_accuracy')
                OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='trip_stops' AND column_name='delivery_note') THEN
                RAISE EXCEPTION 'required repair columns missing';
              END IF;
            END
            \$\$;
          "
